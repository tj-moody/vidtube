services:
  server:
    build:
      context: server/
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL}
    depends_on:
      db:
        condition: service_started

  client:
    build:
      context: client/
    ports:
      - "8000:80"
  db:
    image: postgres:15
    container_name: local-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tj
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: vidtube
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  s3:
    image: localstack/localstack
    ports:
      - "4566:4566"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - "./bin/localstack/:/etc/localstack/init/ready.d"
      - "localstack-data:/var/lib/localstack"

volumes:
  pgdata:
  localstack-data:
